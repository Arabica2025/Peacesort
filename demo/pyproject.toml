[project]
name = "peacesort"
version = "0.1.0"
description = "Peacesort algorithm visualization demos"
authors = [
    { name = "Sungjun Kim", email = "sjkim23@bu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "manimgl>=1.7.2",
    "setuptools<81",
]

[project.scripts]
peacesort = "peacesort:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
